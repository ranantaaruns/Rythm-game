<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Beats — Vertical Scrolling Rhythm Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app">
    <!-- ===== MENU ===== -->
    <section id="screen-menu" class="screen active">
      <div class="panel">
        <h1 class="logo">NEON<span>BEATS</span></h1>
        <p class="tagline">Vertical scrolling rhythm game</p>

        <div class="difficulty" role="group" aria-label="Difficulty">
          <button class="diff-btn" data-diff="easy">EASY</button>
          <button class="diff-btn selected" data-diff="normal">NORMAL</button>
          <button class="diff-btn" data-diff="hard">HARD</button>
        </div>

        <button id="btn-start" class="primary">START</button>

        <div class="howto">
          <p><b>Keys</b> D F J K &nbsp;·&nbsp; ← ↓ ↑ →</p>
          <p><b>Touch</b> tap the four lanes</p>
          <p><b>Esc</b> pause / resume</p>
        </div>
      </div>
    </section>

    <!-- ===== GAME ===== -->
    <section id="screen-game" class="screen">
      <canvas id="playfield"></canvas>

      <div id="hud">
        <div class="hud-row">
          <div id="health" class="health"><div id="health-fill"></div></div>
          <div id="score" class="score">0</div>
        </div>
        <div class="hud-row">
          <div id="accuracy" class="accuracy">100.00%</div>
          <div id="song-title" class="song-title"></div>
          <button id="btn-pause" class="icon-btn" aria-label="Pause">II</button>
        </div>
        <div id="progress" class="progress"><div id="progress-fill"></div></div>
      </div>

      <div id="countdown" class="countdown hidden"></div>

      <div id="pause-overlay" class="overlay hidden">
        <div class="panel small">
          <h2>PAUSED</h2>
          <button id="btn-resume" class="primary">RESUME</button>
          <button id="btn-restart" class="ghost">RESTART</button>
          <button id="btn-quit" class="ghost">QUIT TO MENU</button>
        </div>
      </div>
    </section>

    <!-- ===== RESULTS ===== -->
    <section id="screen-results" class="screen">
      <div class="panel">
        <div id="result-rank" class="rank rank-s">S</div>
        <div id="result-verdict" class="verdict">TRACK CLEARED</div>
        <div id="result-score" class="big-score">1,000,000</div>
        <div id="result-accuracy" class="muted">Accuracy 100.00%</div>
        <table class="breakdown">
          <tr><td class="j-perfect">PERFECT</td><td id="c-perfect">0</td></tr>
          <tr><td class="j-great">GREAT</td><td id="c-great">0</td></tr>
          <tr><td class="j-good">GOOD</td><td id="c-good">0</td></tr>
          <tr><td class="j-miss">MISS</td><td id="c-miss">0</td></tr>
          <tr><td>MAX COMBO</td><td id="c-combo">0</td></tr>
        </table>
        <button id="btn-retry" class="primary">RETRY</button>
        <button id="btn-menu" class="ghost">MENU</button>
      </div>
    </section>
  </main>

  <script src="js/song.js"></script>
  <script src="js/judge.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
